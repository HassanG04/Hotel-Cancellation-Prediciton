[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-cancellation-service"
version = "1.0.0"
description = "XGBoost inference service with PostgreSQL prediction lineage"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
  "pandas>=2.1,<3",
  "passlib>=1.7,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.4,<2",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
notebook = ["jupyter>=1", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["httpx>=0.27,<1", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

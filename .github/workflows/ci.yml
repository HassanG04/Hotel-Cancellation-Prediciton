name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hotel:hotel_test_password@localhost:5432/hotel_test
      TEST_DATABASE_URL: postgresql+psycopg://hotel:hotel_test_password@localhost:5432/hotel_test
      SESSION_SECRET: ci-only-session-secret-with-32-characters
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend tests alembic
      - run: ruff format --check backend tests alembic
      - run: alembic upgrade head
      - run: pytest -q
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8000/docs > /dev/null
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
